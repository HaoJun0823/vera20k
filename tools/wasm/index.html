<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERA20k — WebAssembly preview</title>
<style>
  body { margin: 0; color: #ddd; background: #181818; font: 16px system-ui, sans-serif; }
  header { padding: 16px 24px; }
  h1 { font-size: 22px; }
  button, input { font: inherit; margin: 4px 12px 4px 0; }
  canvas { display: block; width: 100%; height: calc(100vh - 220px); min-height: 480px; outline: none; }
  [hidden] { display: none; }
  #storage { font-size: 14px; }
</style>
<header>
  <h1>VERA20k — WebAssembly preview</h1>
  <p>Single player. Select your extracted Yuri’s Revenge game folder. Files stay on this computer.</p>
  <input id="files" type="file" webkitdirectory multiple aria-label="Game resource folder">
  <button id="start" disabled>Start game</button>
  <p id="status" role="status">Loading engine…</p>
  <p id="storage" role="status">Settings and saves are stored in this browser for this site.</p>
</header>
<canvas id="game" width="1024" height="768" tabindex="0" aria-label="Game"></canvas>
<script type="module" src="./host.js"></script>
</html>
