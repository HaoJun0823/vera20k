name: Publish website downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag (vMAJOR.MINOR.PATCH)'
        type: string
        required: true
      roll_back:
        description: 'Stop a bad release: move latest.json back to this older tag, once GitHub marks it Latest'
        type: boolean
        default: false

permissions:
  contents: read
  attestations: read

concurrency:
  group: website-download-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'YuriPlanet/vera20k' && (github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease))
    # The publisher's secrets live only in this environment: v* tags and main
    # may use it, each run once the maintainer approves it
    # (.github/release/downloads.md).
    environment: downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Read the publisher from maintained main, while the script resolves and
      # verifies the selected release tag independently. No source build occurs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Mirror verified release installers and their signed manifest to R2
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          ROLL_BACK: ${{ inputs.roll_back }}
        run: |
          if [[ $ROLL_BACK == true ]]; then
            bash .github/release/publish-r2.sh "$RELEASE_TAG" --roll-back
          else
            bash .github/release/publish-r2.sh "$RELEASE_TAG"
          fi
